apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: mterraform
  title: mTerraform
  description: Multi-cloud Terraform modules and live environments.
  annotations:
    github.com/project-slug: millad90s/mTerraform
spec:
  owner: user:default/millad90s
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mterraform-live
  title: mTerraform live environments
  description: Root Terraform configurations (dev, staging, prod, local) that compose the modules.
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: millad90s/mTerraform
    backstage.io/source-location: url:https://github.com/millad90s/mTerraform/tree/master/live
  tags: [terraform, iac]
  links:
    - url: https://github.com/millad90s/mTerraform
      title: Repository
spec:
  type: service
  lifecycle: production
  owner: user:default/millad90s
  system: mterraform
  dependsOn:
    - component:default/tf-module-eks-cluster
    - component:default/tf-module-gke-cluster
    - component:default/tf-module-k8s-bootstrap
    - component:default/tf-module-multipass-vm
    - component:default/tf-module-openstack-instance
    - component:default/tf-module-openstack-storage
    - component:default/tf-module-proxmox-lxc
    - component:default/tf-module-proxmox-vm
    - component:default/tf-module-vsphere-storage
    - component:default/tf-module-vsphere-vm
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mterraform-dashboard
  title: mTerraform local dashboard
  description: Local web UI (Python + HTML) to init/plan/apply/destroy Terraform environments.
  annotations:
    github.com/project-slug: millad90s/mTerraform
    backstage.io/source-location: url:https://github.com/millad90s/mTerraform/tree/master/tools/dashboard
  tags: [terraform, tooling]
spec:
  type: tool
  lifecycle: experimental
  owner: user:default/millad90s
  system: mterraform
