name: Terraform Plan

on:
  pull_request:
    paths:
      - "live/**"
      - "modules/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write # for OIDC cloud auth

jobs:
  plan:
    name: plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    defaults:
      run:
        working-directory: live/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      # Configure cloud credentials via OIDC (preferred over static keys).
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}
      # - uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
      #     service_account: ${{ secrets.GCP_PLAN_SA }}

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const out = `#### Terraform Plan — \`${{ matrix.env }}\` \`${{ steps.plan.outcome }}\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: out,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
